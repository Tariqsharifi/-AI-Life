<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلوع کالا | طرح تستی کهکشانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070E;
    --void-2:#0A0F1C;
    --void-3:#101828;
    --nebula-green:#2F8F6C;
    --nebula-green-2:#1E5C46;
    --nebula-violet:#6B4FA0;
    --nebula-violet-2:#3B2C5E;
    --sun:#F5B942;
    --sun-light:#FFD98A;
    --sun-deep:#C9861B;
    --ring:#D8D3EA;
    --star:#F4F2ED;
    --ink:#EDEBF5;
    --ink-dim:rgba(237,235,245,0.66);
    --ink-faint:rgba(237,235,245,0.42);
    --line:rgba(216,211,234,0.16);
    --glass:rgba(16,24,40,0.52);
    --glass-strong:rgba(10,15,28,0.72);
    --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:32px; --r-pill:999px;
    --shadow-glow-gold:0 0 32px rgba(245,185,66,0.35);
    --shadow-glow-green:0 0 40px rgba(47,143,108,0.3);
    --shadow-card:0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    background:var(--void);
  }

  /* ================= moving cosmic background (whole store) ================= */
  .cosmic-bg{
    position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--void);
  }
  .cosmic-bg img{
    position:absolute; top:50%; left:50%;
    width:100%; height:auto;
    max-width:none;
    transform:translate(-50%,-50%) scale(1);
    animation:driftPan 48s ease-in-out infinite;
    filter:saturate(1.05) brightness(0.9);
  }
  @keyframes driftPan{
    0%   { transform:translate(-50%,-50%) scale(1); }
    50%  { transform:translate(-50%,-50%) scale(1.06); }
    100% { transform:translate(-50%,-50%) scale(1); }
  }
  .cosmic-bg::before{
    /* dark vignette + brand tint so text stays readable everywhere */
    content:''; position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(120% 90% at 50% 8%, rgba(5,7,14,0.25), rgba(5,7,14,0.72) 55%, rgba(5,7,14,0.94) 100%),
      linear-gradient(180deg, rgba(5,7,14,0.35) 0%, rgba(5,7,14,0.55) 40%, rgba(5,7,14,0.88) 100%);
  }
  .cosmic-bg::after{
    /* extra twinkling starfield layer, drifts opposite direction for parallax */
    content:''; position:absolute; inset:-10%; z-index:2; opacity:0.5;
    background-image:
      radial-gradient(1.6px 1.6px at 12% 18%, var(--star), transparent),
      radial-gradient(1.2px 1.2px at 78% 8%, var(--star), transparent),
      radial-gradient(1.4px 1.4px at 34% 62%, var(--star), transparent),
      radial-gradient(1px 1px at 90% 44%, var(--star), transparent),
      radial-gradient(1.6px 1.6px at 58% 82%, var(--star), transparent),
      radial-gradient(1px 1px at 6% 76%, var(--star), transparent),
      radial-gradient(1.3px 1.3px at 68% 30%, var(--star), transparent),
      radial-gradient(1px 1px at 22% 94%, var(--star), transparent),
      radial-gradient(1.1px 1.1px at 44% 12%, var(--star), transparent),
      radial-gradient(1.3px 1.3px at 84% 66%, var(--star), transparent);
    background-repeat:no-repeat;
    animation:twinkle 5s ease-in-out infinite, starDrift 60s linear infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:0.35; } 50%{ opacity:0.8; } }
  @keyframes starDrift{ 0%{ transform:translate(0,0); } 100%{ transform:translate(-3%,-2%); } }

  main{ position:relative; z-index:1; max-width:460px; margin:0 auto; }

  /* ---------- header ---------- */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:12px;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(10px);
    color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .logo-stack{ display:flex; flex-direction:column; align-items:center; }
  .logo-text{
    font-weight:800; font-size:22px; line-height:1;
    background:linear-gradient(135deg, var(--sun-light), var(--sun) 55%, var(--sun-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 10px rgba(245,185,66,0.5));
  }
  .logo-sub{ font-size:12px; color:var(--ink-dim); margin-top:1px; font-weight:600; }

  /* ---------- hero copy — no image card, floats over the live bg ---------- */
  .hero{ padding:20px 20px 6px; text-align:center; }
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; color:var(--sun-light);
    background:rgba(245,185,66,0.14); border:1px solid rgba(245,185,66,0.4);
    padding:5px 13px; border-radius:var(--r-pill); margin-bottom:14px;
    backdrop-filter:blur(6px);
  }
  .hero-eyebrow .dot{ width:5px; height:5px; border-radius:50%; background:var(--sun-light); box-shadow:0 0 6px var(--sun-light); }
  .hero h1{
    margin:0 0 10px; font-size:25px; font-weight:800; line-height:1.5; color:var(--star);
    text-shadow:0 2px 20px rgba(0,0,0,0.6);
  }
  .hero p{
    margin:0 auto 18px; font-size:13px; color:var(--ink-dim); line-height:1.8; max-width:80%;
  }
  .hero-btn{
    background:linear-gradient(135deg, var(--sun-light), var(--sun));
    color:#241704; border:none; border-radius:var(--r-pill);
    font-family:'Vazirmatn'; font-weight:800; font-size:13.5px;
    padding:12px 28px; box-shadow:var(--shadow-glow-gold);
  }

  /* ---------- section heads ---------- */
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 18px; margin:28px 0 14px;
  }
  .section-title{
    font-size:14.5px; font-weight:800; color:var(--star);
    display:flex; align-items:center; gap:7px;
    text-shadow:0 1px 10px rgba(0,0,0,0.5);
  }
  .section-title .glyph{ font-size:15px; }
  .section-link{ font-size:11.5px; color:var(--sun-light); font-weight:700; }

  /* ---------- orbit category rail ---------- */
  .orbit-rail{ position:relative; margin:0 0 6px; padding:14px 0 10px; }
  .orbit-rail::before{
    content:''; position:absolute; left:18px; right:18px; top:50%;
    height:1px; background:linear-gradient(90deg, transparent, var(--ring) 12%, var(--ring) 88%, transparent);
    opacity:0.3; transform:translateY(-50%);
  }
  .orbit-scroll{ display:flex; gap:20px; overflow-x:auto; padding:0 18px; scrollbar-width:none; }
  .orbit-scroll::-webkit-scrollbar{ display:none; }
  .planet{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:8px; width:60px; }
  .planet-body{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:20px; position:relative;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.22), transparent 55%), var(--glass-strong);
    border:1.5px solid var(--line); backdrop-filter:blur(8px);
    box-shadow:0 4px 14px rgba(0,0,0,0.45);
  }
  .planet.active .planet-body{
    border-color:transparent;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), transparent 55%),
               linear-gradient(150deg, var(--nebula-green), var(--nebula-green-2));
    box-shadow:0 0 0 3px rgba(47,143,108,0.25), 0 6px 20px rgba(47,143,108,0.45);
  }
  .planet-label{ font-size:10.5px; font-weight:600; color:var(--ink-dim); white-space:nowrap; text-shadow:0 1px 6px rgba(0,0,0,0.5); }
  .planet.active .planet-label{ color:var(--star); font-weight:700; }

  /* ---------- product grid (glassy so bg shows through) ---------- */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 18px 6px; }
  .card{
    background:var(--glass);
    border:1px solid var(--line); border-radius:var(--r-lg);
    overflow:hidden; box-shadow:var(--shadow-card);
    display:flex; flex-direction:column; backdrop-filter:blur(14px);
  }
  .card-thumb{
    aspect-ratio:1/1; position:relative; display:flex; align-items:center; justify-content:center;
    font-size:34px;
    background:radial-gradient(circle at 30% 25%, rgba(107,79,160,0.4), transparent 60%),
               radial-gradient(circle at 75% 80%, rgba(47,143,108,0.32), transparent 55%),
               rgba(5,7,14,0.35);
  }
  .card-thumb .ring{
    position:absolute; width:78%; height:34%; border:1px solid rgba(216,211,234,0.32);
    border-radius:50%; top:52%; left:50%; transform:translate(-50%,-50%) rotate(-8deg);
  }
  .badge{
    position:absolute; top:9px; right:9px; font-size:9px; font-weight:800;
    padding:3px 9px; border-radius:var(--r-pill); background:rgba(245,185,66,0.18);
    color:var(--sun-light); border:1px solid rgba(245,185,66,0.45);
  }
  .card-body{ padding:11px 12px 13px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-cat{ font-size:9.5px; font-weight:800; color:var(--nebula-green); letter-spacing:.2px; }
  .card-name{ font-size:12.5px; font-weight:700; line-height:1.5; color:var(--ink); }
  .card-row{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:4px; }
  .card-price{
    font-size:13.5px; font-weight:800;
    background:linear-gradient(135deg, var(--sun-light), var(--sun));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card-price small{ font-size:9.5px; font-weight:500; color:var(--ink-faint); -webkit-text-fill-color:var(--ink-faint); }
  .buy-btn{
    width:30px; height:30px; border-radius:10px; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--nebula-green), var(--nebula-green-2)); color:var(--star);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(47,143,108,0.45);
  }

  /* ---------- trust strip ---------- */
  .trust{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:26px 18px 0; }
  .trust-item{
    background:var(--glass); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(10px);
    padding:12px 6px; text-align:center; font-size:10px; color:var(--ink-dim); line-height:1.5;
  }
  .trust-item span{ font-size:18px; display:block; margin-bottom:6px; filter:drop-shadow(0 0 6px rgba(245,185,66,0.4)); }

  /* ---------- signature CTA ---------- */
  .comet-cta{
    margin:28px 18px 0; border-radius:var(--r-xl); position:relative; overflow:hidden;
    padding:22px 20px; text-align:center;
    background:
      radial-gradient(120% 140% at 15% -10%, rgba(107,79,160,0.4), transparent 55%),
      radial-gradient(120% 140% at 100% 120%, rgba(47,143,108,0.35), transparent 55%),
      var(--glass-strong);
    border:1px solid var(--line); backdrop-filter:blur(16px);
    box-shadow:var(--shadow-card);
  }
  .comet-cta h3{ margin:0 0 6px; font-size:15px; font-weight:800; color:var(--star); }
  .comet-cta p{ margin:0 0 14px; font-size:12px; color:var(--ink-dim); line-height:1.8; }
  .comet-cta .cta-btn{
    background:linear-gradient(135deg, var(--sun-light), var(--sun)); color:#241704; border:none;
    font-family:'Vazirmatn'; font-weight:800; font-size:13px; padding:11px 24px; border-radius:var(--r-pill);
    box-shadow:var(--shadow-glow-gold);
  }

  footer{ text-align:center; padding:30px 20px 46px; font-size:11px; color:var(--ink-faint); margin-top:8px; }
  footer .fnote{ color:var(--sun-light); font-weight:700; }

  @media (prefers-reduced-motion: reduce){
    .cosmic-bg img, .cosmic-bg::after{ animation:none !important; }
  }

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}
function toEnglishDigits(str){
  if(!str) return str;
  const persian = '۰۱۲۳۴۵۶۷۸۹';
  const arabic = '٠١٢٣٤٥٦٧٨٩';
  return String(str).replace(/[۰-۹٠-٩]/g, (d) => {
    const pIdx = persian.indexOf(d);
    if(pIdx > -1) return pIdx;
    const aIdx = arabic.indexOf(d);
    if(aIdx > -1) return aIdx;
    return d;
  });
}

function showAccMsg(text, ok){
  const el = document.getElementById('accMsg');
  if(!el) return;
  el.textContent = text;
  el.className = 'acc-msg show ' + (ok ? 'ok' : 'err');
}

async function doSignup(){
  const name = document.getElementById('accSignupName').value.trim();
  const email = document.getElementById('accEmail').value.trim();
  const password = document.getElementById('accPassword').value;
  if(!name || !email || !password || password.length < 6){
    showAccMsg('اسم، ایمیل و رمز حداقل ۶ کاراکتری رو پر کن', false);
    return;
  }
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){
    showAccMsg('خطا: ' + error.message, false);
    return;
  }
  currentUser = data.user;
  if(currentUser){
    await sb.from('customer_profiles').insert({ user_id: currentUser.id, full_name: name });
    await loadProfile();
  }
  updateAccountIcon();
  if(!data.session){
    showAccMsg('ثبت‌نام شد! اگه تایید ایمیل فعال باشه، باید ایمیلت رو چک کنی.', true);
  } else {
    renderAccountDrawer();
  }
}

async function doAccLogin(){
  const email = document.getElementById('accEmail').value.trim();
  const password = document.getElementById('accPassword').value;
  if(!email || !password){
    showAccMsg('ایمیل و رمز رو وارد کن', false);
    return;
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    showAccMsg('ایمیل یا رمز اشتباهه', false);
    return;
  }
  currentUser = data.user;
  await loadProfile();
  updateAccountIcon();
  renderAccountDrawer();
}

async function doAccLogout(){
  await sb.auth.signOut();
  currentUser = null;
  currentProfile = null;
  updateAccountIcon();
  accTab = 'login';
  renderAccountDrawer();
}

async function saveProfile(){
  const name = document.getElementById('accProfileName').value.trim();
  const phone = document.getElementById('accProfilePhone').value.trim();
  const { error } = await sb.from('customer_profiles').upsert({
    user_id: currentUser.id, full_name: name || null, phone: phone || null

  if(error){
    showAccMsg('خطا: ' + error.message, false);
  } else {
    await loadProfile();
    showAccMsg('ذخیره شد ✅', true);
  }
}

function getEffectivePrice(p, variantName){
  let base = p.price;
  if(variantName && p.variants && p.variants.length){
    const v = p.variants.find(x => x.name === variantName);
    if(v && v.price) base = v.price;
  }
  if(p.discount > 0){
    return Math.round(base * (1 - p.discount/100));
  }
  return base;
}

function isNewProduct(p){
  if(!p.createdAt) return false;
  const created = new Date(p.createdAt);
  const now = new Date();
  return (now - created) < 7*24*60*60*1000;
}

function computeBestsellerIds(){
  return products.filter(p=>p.orderCount>0).sort((a,b)=>b.orderCount-a.orderCount).slice(0,3).map(p=>p.id);
}

function skeletonGridHtml(count){
  let html = '';

      <div class="sk-thumb"></div>
      <div class="sk-line w60"></div>
      <div class="sk-line w40"></div>

  }
  return html;
}

function catIcon(c){
  const map = {
    'همه': '🏠',
    'خانه و سبک زندگی': '🏠',
    'گجت و هوشمند': '⌚',
    'لوازم خانگی': '🧊',
    'صوتی و تصویری': '🎧',
    'لپ‌تاپ و کامپیوتر': '💻',
    'موبایل و تبلت': '📱',
    'ظروف و لوازم آشپزخانه': '🍽️',
    'لوازم پلاستیکی': '📦',
    'بهداشت و حمام': '🧴',
    'نظافت': '🧹',
    'ابزار': '🛠️'
  };
  if(map[c]) return map[c];
  if(c.includes('آشپز') || c.includes('ظروف')) return '🍽️';
  if(c.includes('حمام') || c.includes('بهداشت')) return '🧴';
  if(c.includes('نظافت')) return '🧹';
  if(c.includes('ابزار')) return '🛠️';
  if(c.includes('الکترونیک') || c.includes('موبایل') || c.includes('گجت')) return '📱';
  if(c.includes('صوتی') || c.includes('هدفون')) return '🎧';
  if(c.includes('لپ') || c.includes('کامپیوتر')) return '💻';
  if(c.includes('ساعت') || c.includes('هوشمند')) return '⌚';
  if(c.includes('خانگی')) return '🧊';
  return '📦';
}

    {id:'لوازم خانگی', label:'لوازم خانگی', icon:'🧊'},

function fmtPrice(n){
  return Number(n).toLocaleString('fa-IR');
}

function getRatingHtml(id){
  const r = ratingsMap[id];
  if(!r || r.count===0) return `<span class="stars">☆☆☆☆☆ <span class="cnt">بدون امتیاز</span></span>`;
  const avg = Math.round(r.sum / r.count);
  const stars = '★'.repeat(avg) + '☆'.repeat(5-avg);
  return `<span class="stars">${stars} <span class="cnt">(${r.count.toLocaleString('fa-IR')})</span></span>`;
}

function sortProducts(list){
  const mode = document.getElementById('sortSelect') ? document.getElementById('sortSelect').value : 'new';
  const copy = [...list];
  if(mode==='bestseller') copy.sort((a,b)=> b.orderCount - a.orderCount);
  else if(mode==='priceAsc') copy.sort((a,b)=> getEffectivePrice(a) - getEffectivePrice(b));
  else if(mode==='priceDesc') copy.sort((a,b)=> getEffectivePrice(b) - getEffectivePrice(a));
  return copy;
}

function getBadgesHtml(p){
  let html = '';
  if(isNewProduct(p)) html += '<span class="badge-tag badge-new">جدید</span>';
  if(bestsellerIds.includes(p.id)) html += '<span class="badge-tag badge-best">پرفروش</span>';
  if(p.discount > 0) html += `<span class="badge-tag badge-discount">${p.discount}٪ تخفیف</span>`;
  return html ? `<div class="badges-row">${html}</div>` : '';
}

function getPriceHtml(p, variantName){
  const eff = getEffectivePrice(p, variantName);
  if(p.discount > 0){
    let basePrice = p.price;
    if(variantName){
      const v = (p.variants||[]).find(x=>x.name===variantName);
      if(v && v.price) basePrice = v.price;
    }
    return `<span class="price-old">${fmtPrice(basePrice)}</span>${fmtPrice(eff)} <small>تومان</small>`;
  }
  return `${fmtPrice(eff)} <small>تومان</small>`;
}

function showSearchSuggestions(q){
  const box = document.getElementById('searchSuggestions');
  const hint = document.getElementById('searchPageHint');
  const term = q.trim();
  if(term.length < 2){
    box.style.display = 'none';
    if(hint){ hint.textContent = SEARCH_HINT_DEFAULT; hint.style.display = 'block'; }
    return;
  }
  const matches = products.filter(p => p.name.includes(term)).slice(0, 6);
  if(matches.length === 0){
    box.style.display = 'none';
    if(hint){ hint.textContent = 'چیزی با این عبارت پیدا نشد 🔍'; hint.style.display = 'block'; }
    return;
  }
  if(hint) hint.style.display = 'none';
  box.innerHTML = matches.map(p => `
    <div class="search-suggestion-item" onclick="selectSearchSuggestion('${p.id}')">
      <img src="${p.img || ''}" onerror="this.onerror=null; this.style.background='var(--tint1)'; this.src='';">

  box.style.display = 'block';
}

function quickOrderFromCard(id){
  const p = products.find(x => x.id===id);
  if(!p) return;
  if(p.variants && p.variants.length > 0){
    openProductDetail(id);
    return;
  }
  orderProduct(id, null);
}

function buildOrderMessage(p, variantName){
  const codeText = p.code ? ` (کد: ${p.code})` : '';
  const variantText = variantName ? ` - ${p.variantLabel || 'گزینه'}: ${variantName}` : '';
  const cardLine = cardPaymentInfo ? `\n\n${cardPaymentInfo}` : '';
  return `سلام، می‌خوام این محصول رو سفارش بدم: ${p.name}${codeText}${variantText}${cardLine}`;
}

function orderProduct(id, variantName){
  const p = products.find(x => x.id===id);
  if(!p) return;
  const price = getEffectivePrice(p, variantName);
  const message = buildOrderMessage(p, variantName);
  requestOrder({
    message,
    onSent: ()=>{
      sb.rpc('increment_order_count', { pid: p.id }).then(()=>{}).catch(()=>{});
      recordOrder([{ name: p.name, code: p.code || '', variant: variantName || '', qty: 1, price: price }], price, null);
    }
  });
}

function getCustomerLocation(){
  const statusEl = document.getElementById('locationStatus');
  const btn = document.getElementById('locationBtn');
  if(!navigator.geolocation){
    statusEl.textContent = 'مرورگرت از لوکیشن پشتیبانی نمی‌کنه';
    return;
  }
  statusEl.textContent = 'در حال گرفتن لوکیشن...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      customerLat = pos.coords.latitude;
      customerLng = pos.coords.longitude;
      btn.classList.add('got');
      btn.textContent = '✓ لوکیشن اضافه شد';
      statusEl.textContent = 'لوکیشنت با سفارش ارسال می‌شه';
    },
    (err) => {
      customerLat = null;
      customerLng = null;
      statusEl.textContent = '⚠️ دسترسی به لوکیشن رد شد. بدون لوکیشن نمی‌تونی سفارش ثبت کنی، لطفاً دوباره امتحان کن و اجازه بده';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}
function finalizeOrder(){
  const name = document.getElementById('customerNameInput').value.trim();
  const phone = toEnglishDigits(document.getElementById('customerPhoneInput').value.trim());
  const province = document.getElementById('customerProvinceInput').value;
  const city = document.getElementById('customerCityInput').value;
  const district = document.getElementById('customerDistrictInput').value;
  const manualAddress = document.getElementById('customerManualAddressInput').value.trim();
  const street = document.getElementById('customerStreetInput').value.trim();
    const plaque = toEnglishDigits(document.getElementById('customerPlaqueInput').value.trim());
  const unit = toEnglishDigits(document.getElementById('customerUnitInput').value.trim());
  const postal = toEnglishDigits(document.getElementById('customerPostalInput').value.trim());
  if(!name || !phone){
    alert('لطفاً اسم و شماره تماس رو وارد کن');
    return null;
  }
  if(!province || !city || !street || !plaque){
    alert('لطفاً استان، شهر، خیابان و پلاک رو کامل وارد کن');
    return null;
  }
  if(postal && postal.length !== 10){
    alert('کد پستی باید ۱۰ رقم باشه');
    return null;
  }
  if(!customerLat || !customerLng){
    alert('برای ثبت سفارش باید روی دکمه «ثبت لوکیشن» بزنی و اجازه بدی');
    return null;
  }

  const address = `${province}، ${city}${district ? '، ' + district : ''}، ${street}، پلاک ${plaque}${unit ? '، واحد ' + unit : ''}${manualAddress ? '، ' + manualAddress : ''}${postal ? '، کد پستی: ' + postal : ''}`;

  localStorage.setItem('bazarcheh_customer_name', name);
  localStorage.setItem('bazarcheh_customer_phone', phone);
  localStorage.setItem('bazarcheh_customer_province', province);
  localStorage.setItem('bazarcheh_customer_city', city);
  localStorage.setItem('bazarcheh_customer_district', district);
  localStorage.setItem('bazarcheh_customer_manual_address', manualAddress);
  localStorage.setItem('bazarcheh_customer_street', street);
  localStorage.setItem('bazarcheh_customer_plaque', plaque);
  localStorage.setItem('bazarcheh_customer_unit', unit);
  localStorage.setItem('bazarcheh_customer_postal', postal);

  lastCustomerName = name;
  lastCustomerPhone = phone;
  lastCustomerAddress = address;

  if(pendingOrder && pendingOrder.onSent) pendingOrder.onSent();

  return { name, phone, address };
}

function selectChannel(channel){
  if(!pendingOrder) return;
  const result = finalizeOrder();
  if(!result) return;
  const { name, phone, address } = result;

  const locationLine = `\nلوکیشن: https://www.google.com/maps?q=${customerLat},${customerLng}`;
  const fullMessage = `${pendingOrder.message}\n\nاسم: ${name}\nشماره تماس: ${phone}\nآدرس: ${address}${locationLine}`;
  const encoded = encodeURIComponent(fullMessage);
  document.getElementById('channelOverlay').classList.remove('open');
  if(channel === 'telegram'){
    window.open(`https://t.me/${TELEGRAM_USERNAME}?text=${encoded}`, '_blank');
  } else {
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encoded}`, '_blank');
  }
  pendingOrder = null;
}

/* ---------- Cart ---------- */
function saveCart(){ localStorage.setItem('bazarcheh_cart', JSON.stringify(cart)); }

function cartKey(id, variant){ return id + '|' + (variant || ''); }

function addToCart(id, variant){
  const key = cartKey(id, variant);
  const existing = cart.find(c => cartKey(c.id, c.variant)===key);
  if(existing) existing.qty += 1;
  else cart.push({ id, variant: variant || null, qty: 1 });
  saveCart();
  updateBadges();
  const bumpTarget = document.getElementById('menuTriggerBtn');
  if(bumpTarget){
    bumpTarget.classList.remove('bump');
    void bumpTarget.offsetWidth;
    bumpTarget.classList.add('bump');
  }
  if(document.getElementById('cartDrawer').classList.contains('open')) renderCartDrawer();
}


function changeQty(id, variant, delta){
  const key = cartKey(id, variant);
  const item = cart.find(c => cartKey(c.id, c.variant)===key);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) cart = cart.filter(c => cartKey(c.id, c.variant)!==key);
  saveCart();
  updateBadges();
  renderCartDrawer();
}

function removeFromCart(id, variant){
  const key = cartKey(id, variant);
  cart = cart.filter(c => cartKey(c.id, c.variant)!==key);
  saveCart();
  updateBadges();
  renderCartDrawer();
}

function updateBadges(){
  const cartCount = cart.reduce((s,c)=>s+c.qty, 0);
  const cartBadge = document.getElementById('cartBadge');
  cartBadge.textContent = cartCount;
  cartBadge.style.display = cartCount>0 ? 'flex' : 'none';

  const wishBadge = document.getElementById('wishBadge');
  wishBadge.textContent = wishlist.length;
  wishBadge.style.display = wishlist.length>0 ? 'flex' : 'none';
  const menuBadge = document.getElementById('menuBadge');
  if(menuBadge) menuBadge.style.display = (cartCount>0 || wishlist.length>0) ? 'block' : 'none';

  const cartBadgeMenu = document.getElementById('cartBadgeMenu');
  if(cartBadgeMenu){
    cartBadgeMenu.textContent = cartCount;
    cartBadgeMenu.style.display = cartCount>0 ? 'flex' : 'none';
  }
}

function openCart(){
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('cartOverlay').classList.add('open');
  renderCartDrawer();
}
function closeCart(){
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('cartOverlay').classList.remove('open');
}

function cartTotalRaw(){
  return cart.reduce((sum, c) => {
    const p = products.find(x => x.id===c.id);
    return p ? sum + getEffectivePrice(p, c.variant) * c.qty : sum;
  }, 0);
}

function renderCartDrawer(){
  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  if(cart.length===0){
    body.innerHTML = `<div class="empty-drawer"><div class="icon">🛍</div><div>سبد خریدت خالیه</div><button onclick="closeCart()">شروع خرید</button></div>`;

    foot.style.display = 'none';
    return;
  }
  foot.style.display = 'block';
  body.innerHTML = cart.map(c => {
    const p = products.find(x => x.id===c.id);
    if(!p) return '';
    return `
      <div class="cart-item">
        <img src="${p.img||''}" onerror="this.style.background='var(--placeholder)'; this.src='';">
        <div class="ci-info">
          <div class="ci-name">${p.name}</div>
          ${c.variant ? `<div class="ci-variant">${p.variantLabel || 'گزینه'}: ${c.variant}</div>` : ''}
          <div class="ci-price">${fmtPrice(getEffectivePrice(p, c.variant) * c.qty)} تومان</div>
          <div class="qty-row">
            <button onclick="changeQty('${p.id}', ${c.variant ? `'${c.variant}'` : 'null'}, -1)">−</button>
            <span>${c.qty.toLocaleString('fa-IR')}</span>
            <button onclick="changeQty('${p.id}', ${c.variant ? `'${c.variant}'` : 'null'}, 1)">+</button>
          </div>
        </div>
        <button class="cart-remove" onclick="removeFromCart('${p.id}', ${c.variant ? `'${c.variant}'` : 'null'})">✕</button>
      </div>
    `;
  }).join('');

  let total = cartTotalRaw();
  if(appliedCoupon) total = Math.round(total * (1 - appliedCoupon.percent/100));
  document.getElementById('cartTotal').textContent = fmtPrice(total) + ' تومان';

    const noteBox = document.getElementById('shippingNoteBox');
  if(shippingNote){
    noteBox.style.display = 'block';
    noteBox.textContent = shippingNote;
  } else {
    noteBox.style.display = 'none';
  }

  const cardBox = document.getElementById('cardPaymentBox');
  if(cardPaymentInfo){
    cardBox.style.display = 'block';
    cardBox.textContent = cardPaymentInfo;
  } else {
    cardBox.style.display = 'none';
  }
}


async function applyCoupon(){
  const code = document.getElementById('couponInput').value.trim().toUpperCase();
  const msgEl = document.getElementById('couponMsgShop');
  if(!code){ msgEl.textContent=''; appliedCoupon=null; renderCartDrawer(); return; }

  const { data, error } = await sb.from('coupons').select('*').eq('code', code).eq('active', true).maybeSingle();
  if(error || !data){
    appliedCoupon = null;
    msgEl.style.color = 'var(--pomegranate)';
    msgEl.textContent = 'کد تخفیف معتبر نیست';
  } else {
    appliedCoupon = data;
    msgEl.style.color = '#2A6B3B';
    msgEl.textContent = `${data.percent}٪ تخفیف اعمال شد ✅`;
  }
  renderCartDrawer();
}

function checkoutCart(){
  if(cart.length===0) return;
  let itemsData = [];
  let lines = cart.map(c => {
    const p = products.find(x => x.id===c.id);
    if(!p) return '';
    const codeText = p.code ? ` (کد: ${p.code})` : '';
    const variantText = c.variant ? ` - ${p.variantLabel || 'گزینه'}: ${c.variant}` : '';
    itemsData.push({ name: p.name, code: p.code || '', variant: c.variant || '', qty: c.qty, price: getEffectivePrice(p, c.variant) });
    return `- ${p.name}${codeText}${variantText} × ${c.qty}`;
  }).filter(Boolean).join('\n');

  let total = cartTotalRaw();
  let discountLine = '';
  if(appliedCoupon){
    total = Math.round(total * (1 - appliedCoupon.percent/100));
    discountLine = `\nکد تخفیف: ${appliedCoupon.code} (${appliedCoupon.percent}٪)`;
  }
    const shippingLine = shippingNote ? `\n\n${shippingNote}` : '';
  const cardLine = cardPaymentInfo ? `\n\n${cardPaymentInfo}` : '';

  const message = `سلام، می‌خوام این سفارش رو ثبت کنم:\n${lines}${discountLine}\n\nمجموع: ${fmtPrice(total)} تومان${shippingLine}${cardLine}`;


  requestOrder({
    message,
    onSent: ()=>{
      cart.forEach(c => sb.rpc('increment_order_count', { pid: c.id }).then(()=>{}).catch(()=>{}));
      recordOrder(itemsData, total, appliedCoupon);
    }
  });
}

let galleryIndex = 0, galleryCount = 0;
function initGallery(count){
  galleryIndex = 0;
  galleryCount = count;
  const track = document.getElementById('pdGalleryTrack');
  if(!track) return;
  track.scrollLeft = 0;
  track.onscroll = ()=>{
    const idx = Math.round(track.scrollLeft / track.clientWidth);
    galleryIndex = idx;
    document.querySelectorAll('#pdGalleryDots span').forEach((d,i)=> d.classList.toggle('active', i===idx));
  };
}

function goToSlide(i){
  const track = document.getElementById('pdGalleryTrack');
  if(!track) return;
  galleryIndex = i;
  track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' });
}

function shareProduct(id){
  const p = products.find(x => x.id===id);
  if(!p) return;
  const url = `${window.location.origin}${window.location.pathname}?product=${id}`;
  const shareData = {
    title: p.name,
    text: `${p.name} - ${Number(p.price).toLocaleString('fa-IR')} تومان`,
    url
  };
  if(navigator.share){
    navigator.share(shareData).catch(()=>{ copyShareLink(url); });
  } else {
    copyShareLink(url);
  }
}

function copyShareLink(url){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>{
      alert('لینک محصول کپی شد ✅');
    }).catch(()=>{
      prompt('لینک محصول رو کپی کن:', url);

async function rateProduct(id, rating){
  await sb.from('product_ratings').insert({ product_id: id, rating });
  const { data: ratingsData } = await sb.from('product_ratings').select('product_id, rating');
  ratingsMap = {};
  (ratingsData || []).forEach(r => {
    if(!ratingsMap[r.product_id]) ratingsMap[r.product_id] = { sum:0, count:0 };
    ratingsMap[r.product_id].sum += r.rating;
    ratingsMap[r.product_id].count += 1;
  });
  openProductDetail(id);
  renderGrid();
}

async function sendHadis(){
  const input = document.getElementById('hadisInput');
  const text = input.value.trim();
  if(!text) return;

  const msgs = document.getElementById('hadisMsgs');
  msgs.innerHTML += `<div class="hmsg user">${text}</div>`;
  input.value = '';
  msgs.scrollTop = msgs.scrollHeight;

  const loadingId = 'loading-' + Date.now();
  msgs.innerHTML += `<div class="hmsg loading" id="${loadingId}">در حال تایپ...</div>`;
  msgs.scrollTop = msgs.scrollHeight;

  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/hadis-chat`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    document.getElementById(loadingId).remove();
    msgs.innerHTML += `<div class="hmsg bot">${data.reply || 'ببخشید، مشکلی پیش اومد.'}</div>`;
  } catch(err){
    document.getElementById(loadingId).remove();

/* ---------- Blog ---------- */
let allBlogPostsShop = [];

async function openBlogList(){

}

function openBlogPost(id){

/* ---------- FAQ ---------- */
async function openFaqList(){
  document.getElementById('faqOverlay').classList.add('open');
  const { data, error } = await sb.from('faqs').select('*').eq('active', true).order('sort_order', {ascending:true});
  const body = document.getElementById('faqListBody');
  if(error || !data || data.length===0){

}
function closeFaqList(){

}
function toggleFaqItem(i){
  const a = document.getElementById('faqA-'+i);
  a.classList.toggle('open');

}

/* ---------- Custom pages ---------- */
let allCustomPages = [];

async function loadCustomPages(){
  const { data, error } = await sb.from('custom_pages').select('*').eq('show_in_footer', true).order('sort_order', {ascending:true});
  if(error || !data) return;
  allCustomPages = data;
  const container = document.getElementById('footerLinks');
  data.forEach(p => {
    const span = document.createElement('span');
    span.textContent = p.title;
    span.onclick = () => openCustomPage(p.id);
    container.appendChild(span);
  });
}

async function openCustomPage(id){
  let p = allCustomPages.find(x => x.id===id);
  if(!p){
    const { data } = await sb.from('custom_pages').select('*').eq('id', id).maybeSingle();
    p = data;
  }
  if(!p) return;
  document.getElementById('pageSheet').innerHTML = `
    <button class="pd-close" onclick="closeCustomPage()">✕</button>
    <div class="pd-body">
      <div class="pd-name" style="margin-top:10px;">${p.title}</div>
      <div class="blog-post-content">${p.content}</div>
    </div>
  `;
  document.getElementById('pageOverlay').classList.add('open');
  document.title = p.title + ' | طلوع کالا';
}
function closeCustomPage(){
  document.getElementById('pageOverlay').classList.remove('open');
  document.title = 'طلوع کالا | فروشگاه آنلاین';
}

/* ---------- Forms ---------- */
let allForms = [];

async function openFormsList(){
  document.getElementById('formsListOverlay').classList.add('open');
  const { data, error } = await sb.from('forms').select('*').eq('active', true).order('created_at', {ascending:false});
  const body = document.getElementById('formsListBody');
  if(error || !data || data.length===0){
    body.innerHTML = `<div class="comment-empty">فعلاً فرمی فعال نیست، از طریق تلگرام یا واتساپ در تماس باش</div>`;
    return;
  }
  allForms = data;
  body.innerHTML = data.map(f => `
    <div class="form-card" onclick="openFormFill('${f.id}')">
      <div class="fc-title">${f.title}</div>
      ${f.description ? `<div class="fc-desc">${f.description}</div>` : ''}
    </div>
  `).join('');
}
function closeFormsList(){
  document.getElementById('formsListOverlay').classList.remove('open');
}

function openFormFill(formId){
  const f = allForms.find(x => x.id===formId);
  if(!f) return;
  const fields = f.fields || [];
  document.getElementById('formFillSheet').innerHTML = `
    <button class="pd-close" onclick="closeFormFill()">✕</button>
    <div class="pd-body">
      <div class="pd-name" style="margin-top:10px;">${f.title}</div>
      ${f.description ? `<div class="pd-cat">${f.description}</div>` : ''}
      <div style="margin-top:16px;">
        ${fields.map((field, i) => `
          <div class="form-field-group">
            <label>${field.label}</label>
            ${field.type === 'textarea'
              ? `<textarea id="formField-${i}"></textarea>`
              : `<input type="text" id="formField-${i}">`}
          </div>
        `).join('')}
      </div>
      <button class="form-submit-btn" onclick="submitForm('${f.id}')">ارسال</button>
      <div class="cmsg" id="formFillMsg" style="margin-top:10px;"></div>
    </div>
  `;
  document.getElementById('formFillOverlay').classList.add('open');
}
function closeFormFill(){
  document.getElementById('formFillOverlay').classList.remove('open');
}

async function submitForm(formId){
  const f = allForms.find(x => x.id===formId);
  if(!f) return;
  const fields = f.fields || [];
  const answers = {};
  let hasEmpty = false;
  fields.forEach((field, i) => {
    const val = document.getElementById(`formField-${i}`).value.trim();
    if(!val) hasEmpty = true;
    answers[field.label] = val;
  });

  const msgEl = document.getElementById('formFillMsg');
  if(hasEmpty){
    msgEl.textContent = 'همه فیلدها رو پر کن';
    msgEl.className = 'cmsg show err';
    return;
  }

  const { error } = await sb.from('form_submissions').insert({ form_id: formId, answers });
  if(error){
    msgEl.textContent = 'خطا: ' + error.message;
    msgEl.className = 'cmsg show err';
  } else {
    msgEl.textContent = 'با موفقیت ارسال شد ✅';
    msgEl.className = 'cmsg show ok';
    setTimeout(closeFormFill, 1200);
  }
}
