<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازارچه | فروشگاه آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E5;
    --ink:#271B1E;
    --plum:#2E1F3C;
    --saffron:#D4A017;
    --pomegranate:#A32638;
    --line: rgba(39,27,30,0.14);
    --card: #FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--plum);
    color:var(--paper);
    padding:14px 18px;
    box-shadow:0 2px 14px rgba(0,0,0,0.15);
  }
  .brandrow{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1000px; margin:0 auto;
  }
  .brand{
    font-weight:800; font-size:22px; letter-spacing:0.5px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--saffron);
    box-shadow:0 0 0 4px rgba(212,160,23,0.25);
  }
  .subtag{
    font-size:11.5px; opacity:0.75; margin-top:2px;
  }

  .search-wrap{
    max-width:1000px; margin:14px auto 0; padding:0 18px 16px;
  }
  .search-box{
    display:flex; align-items:center; gap:10px;
    background:var(--paper); border-radius:14px;
    padding:12px 14px;
  }
  .search-box input{
    border:none; outline:none; background:transparent;
    font-family:'Vazirmatn', sans-serif; font-size:15px;
    flex:1; color:var(--ink); direction:rtl;
  }
  .search-box svg{ flex-shrink:0; opacity:0.55; }

  /* ---------- Category chips ---------- */
  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding:14px 18px 6px;
    max-width:1000px; margin:0 auto;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    padding:9px 18px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-size:13.5px; font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--plum); color:var(--paper); border-color:var(--plum);
  }
  .chip:active{ transform:scale(0.96); }

  /* ---------- Result meta ---------- */
  .meta-line{
    max-width:1000px; margin:0 auto; padding:16px 18px 0;
    font-size:13px; color:rgba(39,27,30,0.6);
  }

  /* ---------- Grid ---------- */
  .grid{
    max-width:1000px; margin:0 auto; padding:14px 18px 60px;
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
  }
  @media(min-width:640px){ .grid{ grid-template-columns:repeat(3,1fr);} }
  @media(min-width:900px){ .grid{ grid-template-columns:repeat(4,1fr);} }

  .card{
    background:var(--card);
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--line);
    display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:active{ transform:scale(0.98); }

  .thumb{
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    font-size:38px;
    position:relative;
    background:linear-gradient(155deg, var(--tint1), var(--tint2));
  }
  .thumb .shopbadge{
    position:absolute; top:8px; right:8px;
    background:rgba(39,27,30,0.55);
    color:#fff; font-size:10px; font-weight:600;
    padding:3px 8px; border-radius:999px;
    backdrop-filter:blur(2px);
  }

  .info{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .pname{ font-size:13.5px; font-weight:700; line-height:1.4; }
  .pcat{ font-size:11px; color:var(--pomegranate); font-weight:600; }
  .prow{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; }
  .price{ font-size:14.5px; font-weight:800; color:var(--plum); }
  .price small{ font-size:10.5px; font-weight:500; color:rgba(39,27,30,0.55); }
  .buybtn{
    border:none; background:var(--saffron); color:var(--plum);
    font-family:'Vazirmatn'; font-weight:700; font-size:12px;
    padding:7px 12px; border-radius:10px; cursor:pointer;
  }
  .buybtn:active{ transform:scale(0.94); }

  .empty{
    text-align:center; padding:60px 20px; color:rgba(39,27,30,0.55);
    grid-column:1/-1;
  }
  .empty .big{ font-size:34px; margin-bottom:8px; }

  footer{
    text-align:center; padding:22px 18px 40px;
    font-size:11.5px; color:rgba(39,27,30,0.45);
  }
</style>
</head>
<body>

<header>
  <div class="brandrow">
    <div>
      <div class="brand"><span class="dot"></span> بازارچه</div>
      <div class="subtag">منتخب فروشگاه‌های محلی</div>
    </div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="جستجوی کالا... مثلاً پیراهن، رژلب، کیف" />
    </div>
  </div>
</header>

<div class="chip-row" id="chipRow"></div>
<div class="meta-line" id="metaLine"></div>
<div class="grid" id="grid"></div>

<footer>ساخته‌شده برای فروش محصولات فروشگاه‌های محلی</footer>

<script>
const products = [
  {id:1, name:"پیراهن مردانه طرح ساده", cat:"پوشاک", price:420000, shop:"فروشگاه پلاسکو", emoji:"👔", t1:"#EADFC8", t2:"#D8C29A"},
  {id:2, name:"مانتو زنانه اسپرت", cat:"پوشاک", price:650000, shop:"مزون آرام", emoji:"🧥", t1:"#E3D5E8", t2:"#C9A8D6"},
  {id:3, name:"شلوار جین کلاسیک", cat:"پوشاک", price:390000, shop:"فروشگاه پلاسکو", emoji:"👖", t1:"#CBD8E3", t2:"#9FB6CC"},
  {id:4, name:"رژ لب مات ماندگار", cat:"آرایشی", price:180000, shop:"عطر و آرایش نگین", emoji:"💄", t1:"#F3D3D8", t2:"#E3A2AC"},
  {id:5, name:"کرم مرطوب‌کننده صورت", cat:"آرایشی", price:145000, shop:"عطر و آرایش نگین", emoji:"🧴", t1:"#DDEBE0", t2:"#B8D6BE"},
  {id:6, name:"عطر جیبی مردانه", cat:"آرایشی", price:230000, shop:"عطر و آرایش نگین", emoji:"🌸", t1:"#E8DFF0", t2:"#C8B4E0"},
  {id:7, name:"کیف دستی چرم زنانه", cat:"کیف و کفش", price:580000, shop:"چرم سرای اهواز", emoji:"👜", t1:"#E9D9C4", t2:"#C9A876"},
  {id:8, name:"کفش اسپرت مردانه", cat:"کیف و کفش", price:720000, shop:"چرم سرای اهواز", emoji:"👟", t1:"#D6E3E8", t2:"#A9C4CC"},
  {id:9, name:"شال و روسری طرح‌دار", cat:"پوشاک", price:210000, shop:"مزون آرام", emoji:"🧣", t1:"#F0E0D0", t2:"#DEBB99"},
  {id:10, name:"ساعت مچی کلاسیک", cat:"اکسسوری", price:490000, shop:"گالری زمان", emoji:"⌚", t1:"#E0E0D8", t2:"#BFBFAE"},
  {id:11, name:"عینک آفتابی طرح جدید", cat:"اکسسوری", price:260000, shop:"گالری زمان", emoji:"🕶️", t1:"#D9DEE8", t2:"#AEB8D0"},
  {id:12, name:"گردنبند نقره زنانه", cat:"اکسسوری", price:310000, shop:"گالری زمان", emoji:"📿", t1:"#EDE6D6", t2:"#D4C6A4"},
];

const categories = ["همه", ...Array.from(new Set(products.map(p=>p.cat)))];
let activeCat = "همه";
let query = "";

const chipRow = document.getElementById('chipRow');
const grid = document.getElementById('grid');
const metaLine = document.getElementById('metaLine');
const searchInput = document.getElementById('searchInput');

function renderChips(){
  chipRow.innerHTML = categories.map(c =>
    `<div class="chip ${c===activeCat?'active':''}" data-cat="${c}">${c}</div>`
  ).join('');
  chipRow.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeCat = el.dataset.cat;
      renderChips();
      renderGrid();
    });
  });
}

function fmtPrice(n){
  return n.toLocaleString('fa-IR');
}

function renderGrid(){
  const filtered = products.filter(p=>{
    const matchCat = activeCat==="همه" || p.cat===activeCat;
    const matchQuery = query.trim()==="" ||
      p.name.includes(query) || p.cat.includes(query) || p.shop.includes(query);
    return matchCat && matchQuery;
  });

  metaLine.textContent = `${filtered.length.toLocaleString('fa-IR')} کالا پیدا شد`;

  if(filtered.length===0){
    grid.innerHTML = `<div class="empty"><div class="big">🔍</div>هیچ کالایی پیدا نشد<br>عبارت دیگری را امتحان کنید</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="card">
      <div class="thumb" style="--tint1:${p.t1};--tint2:${p.t2}">
        ${p.emoji}
        <span class="shopbadge">${p.shop}</span>
      </div>
      <div class="info">
        <div class="pname">${p.name}</div>
        <div class="pcat">${p.cat}</div>
        <div class="prow">
          <div class="price">${fmtPrice(p.price)} <small>تومان</small></div>
          <button class="buybtn">سفارش</button>
        </div>
      </div>
    </div>
  `).join('');
}

searchInput.addEventListener('input', (e)=>{
  query = e.target.value;
  renderGrid();
});

renderChips();
renderGrid();
</script>

</body>
</html>
