<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI-Life</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    font-family: "Vazirmatn", "Tahoma", sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    color: #fff;
  }

  header {
    padding: 16px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    background: rgba(0, 0, 0, 0.25);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    letter-spacing: 1px;
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    font-size: 15px;
    animation: fadeIn 0.2s ease-in;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message .sender {
    display: block;
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 4px;
  }

  .message.me {
    align-self: flex-end;
    background: #6c5ce7;
    color: #fff;
    border-bottom-left-radius: 4px;
  }

  .message.other {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  #input-area {
    display: flex;
    padding: 12px;
    background: rgba(0, 0, 0, 0.3);
    gap: 8px;
  }

  #message-input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 20px;
    border: none;
    outline: none;
    font-size: 15px;
    background: rgba(255, 255, 255, 0.9);
    color: #222;
  }

  #send-btn {
    padding: 0 20px;
    border: none;
    border-radius: 20px;
    background: #6c5ce7;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  #send-btn:hover {
    background: #5a4bd6;
  }

  #send-btn:disabled {
    background: #999;
    cursor: not-allowed;
  }

  #status {
    text-align: center;
    font-size: 12px;
    padding: 4px;
    opacity: 0.7;
  }

  #chat-container::-webkit-scrollbar {
    width: 6px;
  }

  #chat-container::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
  }
</style>
</head>
<body>

<header>AI-Life</header>
<div id="status">در حال اتصال...</div>
<div id="chat-container"></div>

<div id="input-area">
  <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." autocomplete="off" />
  <button id="send-btn">ارسال</button>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://wzbjlacxmwkhdqhfargh.supabase.co";
const SUPABASE_KEY = "sb_publishable_bYG_5bdL1LBCnzb-dQipUQ_Y5TLnhh3";


  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const chatContainer = document.getElementById("chat-container");
  const messageInput = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const statusEl = document.getElementById("status");

  const CURRENT_SENDER = "من";
const EDGE_FUNCTION_URL = "https://wzbjlacxmwkhdqhfargh.supabase.co/functions/v1/gemini-chat";

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function renderMessage(sender, content) {
    const wrapper = document.createElement("div");
    wrapper.classList.add("message");
    wrapper.classList.add(sender === CURRENT_SENDER ? "me" : "other");

    const senderEl = document.createElement("span");
    senderEl.classList.add("sender");
    senderEl.textContent = sender;

    const contentEl = document.createElement("div");
    contentEl.textContent = content;

    wrapper.appendChild(senderEl);
    wrapper.appendChild(contentEl);
    chatContainer.appendChild(wrapper);
    scrollToBottom();
  }

  async function loadMessages() {
    try {
      const { data, error } = await supabase
        .from("messages")
        .select("*")
        .order("id", { ascending: true });

    if (error) {
  alert(JSON.stringify(error));
  console.error(error);
  statusEl.textContent = error.message;
}
      chatContainer.innerHTML = "";
      if (data && data.length > 0) {
  data.forEach((msg) => {
    renderMessage(msg.username, msg.message);
  });
}
      statusEl.textContent = "متصل";
    } catch (err) {
      console.error("خطای غیرمنتظره:", err);
      statusEl.textContent = "خطا در اتصال";
    }
  }

  async function sendMessage() {
    const content = messageInput.value.trim();
    if (content === "") return;

    sendBtn.disabled = true;

    renderMessage(CURRENT_SENDER, content);
    messageInput.value = "";
    messageInput.focus();

   try {
  const { error } = await supabase
    .from("messages")
    .insert([{ username: CURRENT_SENDER, message: content }]);

  if (error) throw error;

    const response = await fetch(EDGE_FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      prompt: content,
      npc: {
        persona: "تو دختری به نام حدیث هستی. همیشه به فارسی جواب بده. شخصیتت مهربان و صمیمی است."
      }
    })
  });

  const data = await response.json();

  const aiReply = data.reply || "متأسفم، نتوانستم پاسخ بدهم.";


  renderMessage("حدیث", aiReply);

  await supabase.from("messages").insert([
    {
      username: "حدیث",
      message: aiReply,
    },
  ]);

} catch (err) {
  console.error(err);
  statusEl.textContent = "خطا";
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }
  });

  function subscribeToNewMessages() {
    supabase
      .channel("public:messages")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "messages" },
        (payload) => {
      const msg = payload.new;

renderMessage(msg.username, msg.message);
        }
      )
      .subscribe();
  }

  loadMessages();
  subscribeToNewMessages();
</script>

</body>
</html>
